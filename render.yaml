services:
  - type: web
    name: korean-fm-bitchord-addon
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /healthz
    autoDeployTrigger: 'off'
    envVars:
      - key: PROXY_SECRET
        generateValue: true
